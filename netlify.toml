[build]
  publish = "public"
  # Stamp each deploy with its commit so open pages can tell when they're out of date
  command = "sed -i \"s/__APP_VERSION__/${COMMIT_REF}/\" public/index.html && printf '%s' \"$COMMIT_REF\" > public/version.txt"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/version.txt"
  [headers.values]
    Cache-Control = "no-store"
